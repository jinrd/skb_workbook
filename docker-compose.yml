services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skb_workbook_frontend

    env_file:
      - path: ./deploy/.env
        required: true

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    ports:
      - "127.0.0.1:3000:3000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      caddy_proxy:
        aliases:
          - skb-workbook-frontend

networks:
  caddy_proxy:
    external: true
    name: caddy_proxy
